name: Bug report
description: Something does not work
body:
  - type: markdown
    attributes:
      value: "**Security issues** (password leaks, prompt bypass): use a private security advisory instead, see SECURITY.md."
  - type: textarea
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    attributes:
      label: herdr version (`herdr --version`)
    validations:
      required: true
  - type: input
    attributes:
      label: OS and how you reach herdr (local, SSH, phone client)
  - type: textarea
    attributes:
      label: Plugin log (`herdr plugin log list`, entries for sudo-askpass)
      description: Check it contains no password before pasting.
